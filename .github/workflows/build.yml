name: build

# 自检：每次 push / PR 自动编译，并跑数据层与 GUI 冒烟测试。
# 工具链对齐本地：Qt 6.11.0（Windows 用 MinGW 64 位，见 D:/Qt/qt/6.11.0/mingw_64）。
#   - Ubuntu: GCC 编译 + 冒烟测试（≈ MinGW 行为）
#   - Windows: MinGW 编译（镜像本地 Qt Creator 工具链）
# 说明：install-qt-action 在 Windows runner 上装 Qt 曾有下载/解压失败，
#   故 Windows 任务使用短安装路径 C:\Qt 且关闭缓存。

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: 'linux_gcc_64'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Data smoke test
        run: QT_QPA_PLATFORM=offscreen ./build/TransitLogDataSmoke
      - name: GUI smoke test
        run: QT_QPA_PLATFORM=offscreen ./build/TransitLogGuiSmoke

  build-windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Install Qt (MinGW 6.11.0)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: 'win64_mingw'
          dir: 'C:\Qt'
          aqtversion: '==3.3.*'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='C:\Qt\6.11.0\mingw_64'
      - name: Build
        run: cmake --build build
