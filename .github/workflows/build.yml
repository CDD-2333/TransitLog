name: build

# 自检：每次 push / PR 自动编译并跑数据层与 GUI 冒烟测试。
# Ubuntu(GCC) 编译 + 测试（GCC 与本地 MinGW 同属 GCC 家族，行为接近）。
# 说明：Windows 侧编译由本地 Qt Creator（Qt 6.11.0 MinGW，见 D:/Qt/qt/6.11.0/mingw_64）
#   负责；曾尝试在 CI 用 aqt 装 Windows Qt，因 download.qt.io 对 windows 包下载不稳定
#   连续失败，故不再配置 Windows CI 任务。

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: 'linux_gcc_64'
          modules: 'qtcharts'   # P1 统计图表需要 Qt Charts
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Data smoke test
        run: QT_QPA_PLATFORM=offscreen ./build/TransitLogDataSmoke
      - name: GUI smoke test
        run: QT_QPA_PLATFORM=offscreen ./build/TransitLogGuiSmoke
